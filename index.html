<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Header -->
    <header class="app-header">
        <h1>To do List</h1>
        <button id="toggle-theme-btn" class="btn-theme">Dark Mode</button>
    </header>

    <!-- Container -->
    <main class="container">
        <!-- Panel Kiri: List Todo -->
        <section class="left-panel">
            <h2>Daftar Todo</h2>

            <!-- Container untuk daftar Todo dari JavaScript -->
            <ul id="todo-list" class="todo-list">
                <!-- Elemen diproduksi secara dinamis via JavaScript -->
            </ul>
        </section>

        <!-- Panel Kanan: Editor Todo -->
        <aside class="right-panel">
            <h2 id="form-title">Editor Todo</h2>
            <form id="editor-form" class="editor-form">
                <input type="hidden" id="edit-id" value="">

                <div class="form-group-vertical">
                    <label for="edit-title">Judul Todo</label>
                    <input type="text" id="edit-title" placeholder="Masukkan judul tugas..." required>
                </div>
                
                <div class="form-group-vertical">
                    <label for="edit-desc">Deskripsi</label>
                    <textarea id="edit-desc" rows="4" placeholder="Masukkan deskripsi tugas..."></textarea>
                </div>

                <div class="form-group-vertical">
                    <label for="edit-status">Status</label>
                    <select id="edit-status">
                        <option value="pending" selected>Belum Selesai</option>
                        <option value="completed">Selesai</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" id="btn-add" class="btn-add">+ Tambah Todo</button>
                    <button type="button" id="btn-save" class="btn-save" style="display: none;">Simpan Perubahan</button>
                    <button type="button" id="btn-delete" class="btn-delete" style="display: none;">Hapus</button>
                </div>
            </form>
        </aside>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>Galih Arsandy Tawakal</p>
    </footer>

    <!-- Hubungkan berkas JavaScript -->
    <script src="script.js"></script>
</body>
</html>
